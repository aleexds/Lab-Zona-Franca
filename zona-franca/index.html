<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Gestión y Cumplimiento - ZoFranca CR</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <span class="logo-text">🛡️ ZoFranca</span>
    </div>

    <h1 class="title">Portal de Gestión y Cumplimiento</h1>
    <div class="sub-brand">ZOFRANCA CR</div>
    <p class="subtitle">Inicie sesión para acceder al sistema</p>

    <!-- Role Pills Selector -->
    <div class="role-selector">
      <button type="button" class="role-btn" onclick="seleccionarRol('Empresa', this)">Empresa</button>
      <button type="button" class="role-btn" onclick="seleccionarRol('Admin', this)">Admin</button>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="username">Correo Electrónico / Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="usuario@empresa.com" required>
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required>
          <span class="toggle-password">👁️</span>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="recordar">
        <label for="recordar">Recordar mi usuario</label>
      </div>

      <button type="submit" class="btn-submit">
        Iniciar Sesión <span>→</span>
      </button>
    </form>

    <div id="mensajeEstado"></div>
  </div>

  <div class="footer-text">
    Plataforma oficial de seguimiento y pre-clasificación con IA<br>
    <strong>PROCOMER CR</strong>
  </div>

  <!-- Nota el type="module" aquí -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
